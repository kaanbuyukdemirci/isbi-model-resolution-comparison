[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vindr-isbi"
version = "0.1.0"
description = "Single-model training and inference for the VinDr-Mammo resolution study"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.11"
dependencies = ["numpy==1.26.4", "PyYAML==6.0.3"]

[project.scripts]
vindr = "vindr_isbi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vindr_isbi = ["presets/*.json", "assets/*.json", "assets/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
